services:
  - type: web
    name: amora-beauty
    env: python
    rootDir: projeto
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: amora-db
          property: connectionString
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true

databases:
  - name: amora-db
    plan: free

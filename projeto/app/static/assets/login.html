<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar | Amora Beauty</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <a class="brand" href="/index.html">✿ amora<span>beauty</span></a>
    <h2>Que bom ter você aqui!</h2>
    <p>Entre com sua conta. Se for admin, você será levado ao painel.</p>
    <form id="formLogin">
      <input id="usuario" placeholder="Seu usuário" required>
      <input id="senha" type="password" placeholder="Sua senha" required>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="/cadastro.html">Cadastre-se</a></p>
    <p><a href="/index.html">Voltar ao início</a></p>
  </main>
  <script>
    document.getElementById("formLogin").addEventListener("submit", async e => {
      e.preventDefault();
      const username = document.getElementById("usuario").value.trim();
      const password = document.getElementById("senha").value;
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username, password }),
      });
      const data = await r.json();
      if (!r.ok) return alert(data.error || "Erro ao entrar");
      localStorage.setItem("logado", data.username);
      localStorage.setItem("role", data.role);
      location.href = data.role === "admin" ? "/admin.html" : "/index.html";
    });
  </script>
</body>
</html>

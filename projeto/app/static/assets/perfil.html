<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil | Amora Beauty</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/index.html"><span class="brand-mark">✿</span> amora<span>beauty</span></a>
    <div class="nav-actions">
      <span id="usuarioNome" class="user-name"></span>
      <a class="nav-link" href="/index.html">Início</a>
      <button class="btn btn-outline btn-small" onclick="sair()">Sair</button>
    </div>
  </nav>

  <main class="section">
    <div class="section-heading">
      <div><span class="eyebrow">MINHA CONTA</span><h2>Olá, <span id="nomeCliente">cliente</span> ♡</h2></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="agendamentos">Meus agendamentos</button>
      <button class="tab" data-tab="pedidos">Meus pedidos</button>
    </div>

    <section id="tab-agendamentos" class="tab-panel"><div id="listaAgendamentos" class="stack"></div></section>
    <section id="tab-pedidos" class="tab-panel" hidden><div id="listaPedidos" class="stack"></div></section>
  </main>

  <footer><a class="brand" href="/index.html">✿ amora<span>beauty</span></a></footer>

  <script>
    const moeda = v => Number(v).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
    const slugify = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "-");

    async function exigirLogin() {
      const r = await fetch("/api/auth/me", { credentials: "include" });
      const u = await r.json();
      if (!u.authenticated) { location.href = "/login.html"; return null; }
      if (u.role === "admin") { location.href = "/admin.html"; return null; }
      document.getElementById("nomeCliente").textContent = u.username;
      document.getElementById("usuarioNome").textContent = "Olá, " + u.username;
      return u;
    }

    function sair() {
      fetch("/api/auth/logout", { method: "POST", credentials: "include" })
        .finally(() => { localStorage.removeItem("logado"); location.href = "/index.html"; });
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.hidden = true);
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).hidden = false;
      });
    });

    async function carregarAgendamentos() {
      const ags = await fetch("/api/me/agendamentos", { credentials: "include" }).then(r => r.json());
      const alvo = document.getElementById("listaAgendamentos");
      if (!ags.length) { alvo.innerHTML = '<div class="empty-state">Você ainda não tem agendamentos.</div>'; return; }
      alvo.innerHTML = ags.map(a => `
        <article class="pedido-card">
          <header>
            <h3>${a.servico} — ${a.store}</h3>
            <span class="status status-${slugify(a.status)}">${a.status}</span>
          </header>
          <p><strong>Quando:</strong> ${a.data} às ${a.hora}</p>
          <p><strong>Técnica:</strong> ${a.tecnica || "-"}</p>
          <p><strong>Valor:</strong> ${moeda(a.preco)}</p>
          ${a.status === "Aguardando confirmação"
            ? `<button class="btn btn-outline btn-small" onclick="cancelarAgendamento(${a.id})">Cancelar solicitação</button>` : ""}
        </article>`).join("");
    }

    async function cancelarAgendamento(id) {
      if (!confirm("Cancelar este agendamento?")) return;
      await fetch(`/api/me/agendamentos/${id}/cancelar`, { method: "PATCH", credentials: "include" });
      carregarAgendamentos();
    }

    async function carregarPedidos() {
      const ps = await fetch("/api/me/pedidos", { credentials: "include" }).then(r => r.json());
      const alvo = document.getElementById("listaPedidos");
      if (!ps.length) { alvo.innerHTML = '<div class="empty-state">Você ainda não tem pedidos.</div>'; return; }
      alvo.innerHTML = ps.map(p => `
        <article class="pedido-card">
          <header>
            <h3>Pedido #${p.id} — ${p.store}</h3>
            <span class="status status-${slugify(p.status)}">${p.status}</span>
          </header>
          <ul>${p.itens.map(i => `<li>${i.nome} × ${i.qtd} — ${moeda(i.preco)}</li>`).join("")}</ul>
          <p><strong>Total:</strong> ${moeda(p.total)}</p>
          <p class="muted">Feito em ${new Date(p.criado_em).toLocaleString("pt-BR")}</p>
          ${p.status === "Aguardando confirmação"
            ? `<button class="btn btn-outline btn-small" onclick="cancelarPedido(${p.id})">Cancelar pedido</button>` : ""}
        </article>`).join("");
    }

    async function cancelarPedido(id) {
      if (!confirm("Cancelar este pedido?")) return;
      await fetch(`/api/me/pedidos/${id}/cancelar`, { method: "PATCH", credentials: "include" });
      carregarPedidos();
    }

    (async () => {
      const u = await exigirLogin();
      if (!u) return;
      await Promise.all([carregarAgendamentos(), carregarPedidos()]);
    })();
  </script>
</body>
</html>

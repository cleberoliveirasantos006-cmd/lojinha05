<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profissional | Amora Beauty</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/index.html"><span class="brand-mark">✿</span> amora<span>beauty</span></a>
    <div class="nav-actions">
      <span id="usuarioNome" class="user-name"></span>
      <a class="nav-link" id="entrarBtn" href="/login.html">Entrar</a>
      <a class="nav-link" id="cadastroBtn" href="/cadastro.html">Criar conta</a>
      <a class="nav-link" id="perfilBtn" href="/perfil.html" hidden>Meu perfil</a>
      <button class="btn btn-outline btn-small" id="sairBtn" onclick="sair()" hidden>Sair</button>
    </div>
  </nav>

  <main class="section">
    <div id="perfilVendedor"></div>

    <section class="section">
      <h2>Serviços</h2>
      <div id="listaServicos" class="stack"></div>
    </section>

    <section class="section">
      <h2>Agendar horário</h2>
      <form id="formAgendamento" class="form-card">
        <select id="servico" required></select>
        <div id="opcoesTecnica"></div>
        <input id="dataAgenda" type="date" required>
        <input id="horaAgenda" type="time" required>
        <textarea id="observacao" placeholder="Observações (opcional)"></textarea>
        <button class="btn btn-primary" type="submit">Solicitar agendamento</button>
      </form>
    </section>

    <section class="section">
      <h2>Produtos</h2>
      <div id="listaProdutos" class="seller-grid"></div>
    </section>

    <aside class="section">
      <h2>Sacolinha</h2>
      <ul id="itensCarrinho"></ul>
      <p><strong>Total:</strong> <span id="totalCarrinho">R$ 0,00</span></p>
      <button class="btn btn-primary" id="finalizarCompra">Finalizar pedido</button>
    </aside>
  </main>

  <script src="/assets/js/script.js"></script>
</body>
</html>
